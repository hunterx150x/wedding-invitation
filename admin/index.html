<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Webding Admin</title>
  <link rel="icon" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="app" id="app">

    <aside class="side" id="side">
      <a class="brand" href="#/dashboard">
        <img src="logo.svg" alt="" width="40" height="40" />
        <span><b>Webding</b><small>Admin</small></span>
      </a>
      <nav class="menu" id="menu" aria-label="เมนู"></nav>
      <div class="side__foot">
        <a href="../" target="_blank" rel="noopener" class="side__link">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          เปิดเว็บการ์ด
        </a>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="top">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="เมนู">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="top__title">
          <p class="crumb" id="crumb"></p>
          <h1 id="pageTitle"></h1>
        </div>
        <div class="top__actions">
          <span class="state" id="saveState"></span>
          <button class="btn btn--ghost preview-btn" id="previewBtn" type="button">
            <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
            ตัวอย่าง
          </button>
          <a class="btn btn--primary" href="#/publish" id="publishBtn">
            <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
            เผยแพร่
          </a>
        </div>
      </header>

      <div class="body">
        <section class="content" id="content" tabindex="-1"></section>

        <aside class="preview" id="preview" aria-label="ตัวอย่าง">
          <div class="preview__bar">
            <div class="seg" id="pvLang" role="group" aria-label="ภาษา">
              <button type="button" data-v="th">TH</button><button type="button" data-v="en">EN</button>
            </div>
            <div class="seg" id="pvDevice" role="group" aria-label="อุปกรณ์">
              <button type="button" data-v="mobile" title="มือถือ"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></button>
              <button type="button" data-v="desktop" title="คอมพิวเตอร์"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg></button>
            </div>
            <button class="icon-btn" id="pvPlay" type="button" title="เล่นแอนิเมชันเปิดซอง">
              <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>
            </button>
            <button class="icon-btn preview__close" id="pvClose" type="button" aria-label="ปิดตัวอย่าง">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div class="preview__stage" id="stage">
            <div class="device" id="device"><iframe id="pvFrame" title="ตัวอย่างเว็บการ์ด"></iframe></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/illustrations.js"></script>
  <script src="admin.js"></script>
</body>
</html>
